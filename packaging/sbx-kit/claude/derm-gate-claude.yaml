# syntax=docker/sandbox-kit:3
#
# derm's gate inside a Docker Sandboxes VM, for Claude Code: a v3 mixin.
#
# Wave 5 lane T, phase 4 (Tony's O1 decision, 4 Nov 2026): derm's gate runs
# inside the sbx VM by default. `derm run --boundary sbx claude-code` builds
# a copy of this kit for each chat, with the person's policy and derm's
# Claude Code hook package under derm-kit/, and passes the folder to
# `sbx create` with --kit. sbx builds a local v3 kit itself at the create
# (Docker's "Use kits" page: "kit.allowLocalKits ... defaults to true"). The
# folder is written by derm and removed after the create; nothing is
# published.
#
# Why v3 (integration w5's fix pass 11, MW5-7): sbx 0.51.0 ships `claude` as
# a v3 kit and refuses a v1 or v2 mixin beside it ("compositions are
# single-format"). This form composed with it on the Mac (sbx 0.51.0, 7 Nov).
#
# Grammar: docker/sandbox-kit-spec docs/spec/SPEC-v3.md at 6838e3e
# (schema "3"; a mixin's content is an overlay on the workload; strict
# decoding refuses any unknown field). Prior art: the spec's own
# examples/claude-mixin and examples/gh.
schemaVersion: "3"
kind: mixin
displayName: derm gate for Claude Code
description: >-
  Runs derm's policy gate as a Claude Code PreToolUse and PostToolUse hook
  inside the sandbox, with a copy of the person's derm policy and its own
  Node. Under the claude kit's full access an ask is a deny.
sourceUrl: https://github.com/aetiusgular/derm
licenses: [MIT]
version: "0.1.3"

# The hook is Claude Code's (its managed settings), so the set must hold
# Claude Code: sbx's claude workload provides `claude@<version>`.
requires: ["claude"]
provides: ["io.github.aetiusgular/derm-gate-claude"]

args:
  # The claude workload starts `claude --dangerously-skip-permissions`
  # (sbx-kit-spec examples/claude/claude.dockerfile, ENTRYPOINT). derm's hook
  # turns an ask into a deny on this hint, since no one inside answers
  # Claude Code's own prompt in that mode (rules case 83;
  # packages/derm-claude-plugin src/core/gate.ts). A fixed value: the arg
  # exists only to export it (SPEC-v3 section 6, `env`).
  fullAccess:
    default: "1"
    enum: ["1"]
    description: Tells derm's hook that Claude Code runs in bypass mode here, so an ask is a deny
    env: DERM_FULL_ACCESS

capabilities:
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      contentFile: ./derm-context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # As root: it puts the gate's code and its Node in /opt/derm-kit,
        # registers the hooks in Claude Code's managed settings, and puts
        # the policy where the hook reads it. A failure stops the create,
        # with the reason (rules case 151).
        - command: "sh /opt/derm-kit-src/install.sh"
          user: "0"
          description: Install derm's gate for Claude Code (code and Node in /opt/derm-kit, hooks in /etc/claude-code/managed-settings.json, policy in ~/.derm)
