# syntax=docker/sandbox-kit:3
#
# derm's gate inside a Docker Sandboxes VM, for Claude Code: a v3 mixin
# whose gate is derm itself. `derm run --boundary sbx claude-code` builds it
# for the chat. (Until 19 Nov 2026 this kit carried a Node and derm's
# TypeScript hook.)
#
# The overlay holds a Linux derm for the VM and no Node, as derm's Codex
# kit does (packaging/sbx-kit/codex/), and the hooks in Claude
# Code's managed settings run `derm hook claude-code <event>` by derm's
# absolute path. `derm kit register claude-code` writes them, from the same
# entries `derm run claude-code` registers on a host
# (crates/derm-cli/src/run/claude_gate.rs, `hooks`).
#
# Grammar: docker/sandbox-kit-spec docs/spec/SPEC-v3.md at 6838e3e (schema
# "3"; a mixin's content is an overlay on the workload; strict decoding
# refuses any unknown field; lifecycle@1: install hooks run once, at
# create, in dependency order, before the entrypoint first runs).
schemaVersion: "3"
kind: mixin
displayName: derm gate for Claude Code
description: >-
  Runs derm's policy gate as a Claude Code PreToolUse and PostToolUse hook
  inside the sandbox, with a copy of the person's derm policy and a derm for
  the VM. Under the claude kit's full access an ask is a deny.
sourceUrl: https://github.com/aetiusgular/derm
licenses: [MIT]
version: "0.1.0"

# The hook is Claude Code's (its managed settings), so the set must hold
# Claude Code: sbx's claude workload provides `claude@<version>`.
requires: ["claude"]
provides: ["io.github.aetiusgular/derm-gate-claude"]

args:
  # The claude workload starts `claude --dangerously-skip-permissions`
  # (sbx-kit-spec examples/claude/claude.dockerfile, ENTRYPOINT). derm's gate
  # turns an ask into a deny on this hint, since no one inside answers
  # Claude Code's own prompt in that mode (rules case 83;
  # crates/derm-cli/src/gate/core.rs). A fixed value: the arg exists only to
  # export it (SPEC-v3 section 6, `env`).
  fullAccess:
    default: "1"
    enum: ["1"]
    description: Tells derm's gate that Claude Code runs in bypass mode here, so an ask is a deny
    env: DERM_FULL_ACCESS

capabilities:
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      contentFile: ./derm-context.md

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # As root: checks the derm it carries runs here, puts it in
        # /usr/local/bin, writes the VM marker, puts the policy where the
        # gate reads it, and registers the hooks in Claude Code's managed
        # settings. A failure stops the create, with the reason (rules case
        # 151).
        - command: "sh /opt/derm-kit-src/install.sh"
          user: "0"
          description: Install derm's gate for Claude Code (derm in /usr/local/bin, hooks in /etc/claude-code/managed-settings.json, policy in ~/.derm)
