# derm's gate inside a Docker Sandboxes VM, for Claude Code.
#
# Wave 5 lane T, phase 4 (Tony's O1 decision, 4 Nov 2026): derm's gate runs
# inside the sbx VM by default. `derm run --boundary sbx claude-code` builds
# a copy of this kit for each chat, with the person's policy and derm's
# Claude Code hook package in files/home/.derm-kit/, and passes the folder to
# `sbx create` with --kit. The folder is written by derm and removed after
# the create; nothing here is published.
#
# Grammar: sbx-kits-contrib's v2 kit spec (spec/SPEC-v2.md at 1de3c1e),
# which sbx 0.51.0 has run (the pi kit, plans/parallel/tk_sbx_smoke.md).
# Prior art: the gitguardian and claude-sbx-statusline mixins, which write
# Claude Code's hook settings from setup.install.
schemaVersion: "2"
kind: mixin
name: derm-gate-claude
version: "0.1.3"
displayName: derm gate for Claude Code
description: Runs derm's policy gate as a Claude Code PreToolUse and PostToolUse hook inside the sandbox, with a copy of the person's derm policy. Under the claude kit's full access an ask is a deny.

# The hook is Claude Code's (managed settings, Claude Code's hook format),
# so composing it onto another agent is an error, not a sandbox with a gate
# nothing reads (SPEC-v2 4.3).
requires:
  agent: claude

environment:
  variables:
    # The claude kit starts `claude --dangerously-skip-permissions`
    # (sbx-kits-contrib claude/spec.yaml:34). derm's hook turns an ask into
    # a deny on this hint, since no one inside answers Claude Code's own
    # prompt in that mode (rules case 83; packages/derm-claude-plugin
    # src/core/gate.ts).
    DERM_FULL_ACCESS: "1"

agentInstructions:
  content: |
    ## derm

    derm's gate checks each of your tool calls against the person's derm
    policy before it runs. A call the policy denies is blocked with a reason
    that starts with "derm". It is the person's rule: say what was blocked
    and why, and do not try another way to do the same thing.

setup:
  install:
    # As root (the default): it puts the gate's code in /opt/derm-kit,
    # registers the hooks in Claude Code's managed settings, and puts the
    # policy where the hook reads it. It stops the create, with the reason,
    # when the image's Node cannot run the hook.
    - command: "sh /home/agent/.derm-kit/install.sh"
      description: Install derm's gate for Claude Code (code in /opt/derm-kit, hooks in /etc/claude-code/managed-settings.json, policy in ~/.derm)
