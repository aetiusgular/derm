# syntax=docker/sandbox-kit:3
#
# derm's gate inside a Docker Sandboxes VM for an agent that takes a
# command hook, with derm itself as the gate: a v3 mixin. The other form of
# packaging/sbx-kit/hooks/derm-gate-hooks.yaml, which carries a Node and
# derm's TypeScript hook packages. `derm run --boundary sbx <agent>` builds
# this one when DERM_SBX_KIT=rust is set (19 Nov 2026), for Copilot CLI,
# Droid, Cursor and Kiro. derm fills in three words: the agent's sbx
# workload, derm's id for the agent, and its name.
#
# What differs: the overlay holds a Linux derm for the VM and no Node, as
# derm's Codex kit does (packaging/sbx-kit/codex/), and the agent's own
# config runs `derm hook <agent> pre` by derm's absolute path. Two install
# commands, in order, as the Codex kit has: root's, then the agent's own
# user's (`user: agent`, as these workloads' own steps name it), which
# writes the agent's config with `derm kit register`, from the agent's row
# of crates/derm-cli/src/connect/gates.json: the entry `derm connect
# <agent> --gate` writes on a host.
#
# Grammar: docker/sandbox-kit-spec docs/spec/SPEC-v3.md at 6838e3e.
schemaVersion: "3"
kind: mixin
displayName: derm gate for @NAME@
description: >-
  Runs derm's policy gate as @NAME@'s pre-tool hook inside the sandbox, with
  a copy of the person's derm policy and a derm for the VM.
sourceUrl: https://github.com/aetiusgular/derm
licenses: [MIT]
version: "0.1.0"

requires: ["@WORKLOAD@"]
provides: ["io.github.aetiusgular/derm-gate-@WORKLOAD@"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # As root: checks the derm it carries runs here, puts it in
        # /usr/local/bin, writes the VM marker and puts the policy where
        # the gate reads it. A failure stops the create, with the reason
        # (rules case 151).
        - command: "sh /opt/derm-kit-src/install.sh @AGENT@"
          user: "0"
          description: Install derm for @NAME@'s gate (derm in /usr/local/bin, policy in ~/.derm)
        # As the agent's user, whose config it is: the hook, in the
        # agent's own config under its home.
        - command: "/usr/local/bin/derm kit register @AGENT@ --home /home/agent"
          user: agent
          description: Register derm's gate in @NAME@'s own config
