[package]
name = "derm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "derm watch: the OTLP receiver, the activity log, the socket server"

[[bin]]
name = "derm-daemon"
path = "src/main.rs"

# Shared with lane K in wave 2 (scaffolded by integration w1), and with lanes
# S, U, V, X, Y and Z in wave 5 (the wave 5 base): each lane edits only the
# lines under its own `# [lane-<X>]` comment, in any table, and pins every
# dependency to an exact version. scripts/lane-scope.mjs checks this.

[features]
# [lane-K]
default = ["computer-use"]
# The fork's computer_use/, out of Tauri since lane K (wave 2): the bridge
# and the helper client served by the daemon (toolkit plan T1.5). On by
# default; it starts only on macOS (computer_use/service.rs). activity/ and
# otel_receiver/ no longer sit behind a flag (lane B, wave 1).
computer-use = []
# [lane-S]
# [lane-U]
# [lane-V]
# [lane-X]
# [lane-Y]
# [lane-Z]
# [lane-5bE]

[dependencies]
derm-core = { path = "../derm-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
uuid.workspace = true
toml.workspace = true
base64.workspace = true
# [lane-K]
# [lane-S]
# The model tap the daemon starts, and content capture's file layout its
# purge reads (lane S's own crate; its third-party code is ureq, reasons in
# plans/parallel/tk_lane_S.md, Decisions).
derm-tap = { path = "../derm-tap" }
# [lane-U]
# [lane-V]
# [lane-X]
# The pre-install check's client (installs/check.rs): the same pin and
# features as derm-tap's, so the lock file gains nothing (lane X).
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
# [lane-Y]
# [lane-Z]
# [lane-5bE]

[target.'cfg(target_os = "macos")'.dependencies]
# objc2 0.6.4 and objc2-foundation 0.3.2 were here for activity/collector.rs's
# `sm` module (integration w1's fix pass); integration w5's phase 1 merge
# removed that module (lane Y's request 2: the collector app registers itself),
# and them with it.
# [lane-K]
# [lane-S]
# [lane-U]
# [lane-V]
# [lane-X]
# [lane-Y]
# [lane-Z]
# [lane-5bE]

[dev-dependencies]
# [lane-K]
# [lane-S]
# [lane-U]
# [lane-V]
# [lane-X]
# [lane-Y]
# [lane-Z]
# [lane-5bE]

# Wave 5 lane Z's Windows-only dependencies (the wave 5 base).

[target.'cfg(windows)'.dependencies]
# [lane-Z]
# [lane-5bE]
