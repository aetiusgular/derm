rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "derm-sysmon: the Windows service that reads Sysmon's channel for each user's derm daemon"

[[bin]]
name = "derm-sysmon"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
