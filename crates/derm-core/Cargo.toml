# Shared with lanes X and Z in wave 5 (sections added by the wave 5 base,
# plans/parallel_build_tk.md section 7c): each edits only the lines under its
# own `# [lane-<X>]` comment, in any table, and pins every dependency to an
# exact version. Everything else changes only through integration.
# scripts/lane-scope.mjs checks this.

[package]
name = "derm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for the toolkit layer: policy, events, tokens"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# peer.rs (moved from derm-cli by integration w2): SO_PEERCRED, SO_PEERPIDFD,
# LOCAL_PEERCRED and proc_pidinfo. The workspace's pinned libc.
libc.workspace = true
# No Unicode crate: fold_text's tables are generated from the TypeScript
# gate core's sources (gen/gen-fold-tables.mjs; integration w1).
# [lane-X]
# [lane-Z]

[dev-dependencies]
# [lane-X]
# [lane-Z]

# Wave 5 lane Z's Windows-only dependencies.
[target.'cfg(windows)'.dependencies]
# [lane-Z]
