# This manifest is shared by lanes C and D in wave 1, lane J in wave 2,
# lanes Q and R in wave 4 (sections added by integration w2), and lanes S, T,
# U, V, W and Z in wave 5 (sections and the Windows table added by the wave 5
# base).
# Wave 5b (the wave 5b base): sections for lanes 5bA to 5bD.
# Wave 6 (the wave 6 base): sections for lanes 6A to 6E.
# Each lane edits only the lines under its own `# [lane-X]` comment, in any
# table, and pins every dependency to an exact version
# (plans/parallel_build_tk.md, section 2, point 5). A section ends at the
# next marker or the next table header. Everything else is session 0's and
# changes only through integration. scripts/lane-scope.mjs checks this.

[package]
name = "derm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "derm: connect, run, watch"

[[bin]]
name = "derm"
path = "src/main.rs"

[features]
default = []
# The wave 5b base's red tests (`tests/hook_cases_5bA.rs`, `_5bB.rs` and
# `contracts_w5b.rs`) built only with this feature while they failed on
# purpose. Since the close (11 Nov) they pass and always build; the feature
# is kept, empty, so the lanes' recorded commands still run.
w5b-red = []
# The wave 6 base's red tests (`tests/contracts_w6.rs`), built only with this
# feature while they fail on purpose; integration makes them always build at
# the close, as it did for w5b-red.
w6-red = []
# [lane-C]
# [lane-D]
# [lane-J]
# [lane-Q]
# [lane-R]
# [lane-S]
# [lane-T]
# [lane-U]
# [lane-V]
# [lane-W]
# [lane-Z]
# [lane-5bA]
# [lane-5bB]
# [lane-5bC]
# [lane-5bD]
# [lane-6A]
# [lane-6B]
# [lane-6C]
# [lane-6D]
# [lane-6E]

[dependencies]
derm-core = { path = "../derm-core" }
serde.workspace = true
serde_json.workspace = true
# Shared by lanes C and D since integration w1 (lane D's request 6).
libc.workspace = true
# [lane-C]
# Format-preserving TOML edits for Codex's config.toml: comments and key
# order survive a write. Reason and pin in the lane C status doc.
toml_edit = "=0.25.17"
sha2.workspace = true
# [lane-D]
# `derm run`: the daemon socket client (lane D's own crate) and chat and event
# ids (uuid, the workspace's exact pin).
derm-audit-linux = { path = "../derm-audit-linux" }
uuid.workspace = true
# [lane-J]
# [lane-Q]
# [lane-R]
# `derm run` calls the daemon's `apply_export` for Claude Code's and Codex's
# own OTel (lane B built it; integration w1's request for lane R). A path
# crate of this workspace, already a dev-dependency below: no new
# third-party code.
derm-daemon = { path = "../derm-daemon" }
# [lane-S]
# The model tap's route and launch shapes, and the settings reader (lane S's
# own crate). A path crate of this workspace: no third-party code beyond
# derm-tap's own (ureq; plans/parallel/tk_lane_S.md, Decisions).
derm-tap = { path = "../derm-tap" }
# [lane-T]
# [lane-U]
# [lane-V]
# [lane-W]
# [lane-Z]
# [lane-5bA]
# [lane-5bB]
# [lane-5bC]
# [lane-5bD]
# [lane-6A]
# [lane-6B]
# [lane-6C]
# `derm secret` and the chain per tier read and write derm-egress's own files
# (secrets.json, the local CA). A path crate of this workspace; its own
# third-party code is pinned in its manifest (plans/parallel/tk_lane_6C.md).
derm-egress = { path = "../derm-egress" }
# [lane-6D]
# [lane-6E]

[[test]]
name = "hook_cases_5bA"

[[test]]
name = "hook_cases_5bB"

[[test]]
name = "contracts_w5b"

[[test]]
name = "contracts_w6"
required-features = ["w6-red"]

[dev-dependencies]
# [lane-C]
# [lane-D]
# [lane-J]
# [lane-Q]
# [lane-R]
# `derm watch` and `derm status` are tested against the real daemon, started in
# the test process on a temporary socket (crates/derm-cli/src/watch/live_tests.rs),
# so the client is held to lane B's server, not to a fake. A path crate of
# this workspace: no new third-party code.
derm-daemon = { path = "../derm-daemon" }
